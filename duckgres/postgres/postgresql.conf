# ============================================================================
# PostgreSQL Configuration — catalogo DuckLake (metadata + data inlining)
# ============================================================================
# Dimensionato per il catalogo DuckLake: tabelle di metadati + dati
# inlined in attesa del checkpoint (flush su S3). Non è il database
# analitico: le query pesanti girano su Duckgres/Parquet.

# ----------------------------------------------------------------------------
# MEMORY
# ----------------------------------------------------------------------------

shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB
autovacuum_work_mem = 128MB
temp_buffers = 16MB

# ----------------------------------------------------------------------------
# DISK (NVMe RAID)
# ----------------------------------------------------------------------------

random_page_cost = 1.1
effective_io_concurrency = 200

# ----------------------------------------------------------------------------
# WAL
# ----------------------------------------------------------------------------

wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_timeout = 5min

# ----------------------------------------------------------------------------
# CONNESSIONI
# ----------------------------------------------------------------------------

listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# ----------------------------------------------------------------------------
# AUTOVACUUM — le tabelle inlined crescono e si svuotano a ogni checkpoint
# ----------------------------------------------------------------------------

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_cost_limit = 1000

# ----------------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------------

log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ----------------------------------------------------------------------------
# MISC
# ----------------------------------------------------------------------------

timezone = 'Europe/Rome'
